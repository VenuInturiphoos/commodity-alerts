name: Commodity Price Alerter

on:
  schedule:
    # Runs every 3 minutes, 24/7
    - cron: '*/3 * * * *'
  workflow_dispatch: # Allows manual trigger from the UI
  repository_dispatch:
    types: [trigger-cron] # Allows triggering via external webhook

concurrency:
  group: alerter-cron
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python main.py
