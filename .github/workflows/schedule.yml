name: Commodity Price Alerter

on:
  schedule:
    # Runs automatically in GitHub Actions cloud every 5 minutes during trading days (Mon-Fri)
    - cron: '*/5 * * * 1-5'
  workflow_dispatch: # Allows manual trigger from the UI
  repository_dispatch:
    types: [trigger-cron] # Allows triggering via external webhook

permissions:
  contents: write

concurrency:
  group: alerter-cron
  cancel-in-progress: true

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intraday Monitoring (2-Minute Interval Cadence)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_AUTOPILOT_ENABLED: ${{ secrets.DHAN_AUTOPILOT_ENABLED }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Maintain precise 2-minute cadence across the 5-minute GitHub Actions schedule window
          for i in 1 2 3; do
            START_TS=$(date +%s)
            echo "=== Intraday 2-Minute Cadence Check #$i at $(date -u) ==="
            python main.py
            
            git add web/near_alerts.json web/circuits_data.json web/circuits_history_30d.json web/circuits_history_60d.json web/alerts_state.json web/advisory_trades_tracker.json web/nifty_crossover_oversold.json web/stock_investments_tracker.json web/golden_cross_history.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update near alerts and circuit limits data [skip ci]" || true
              git pull --rebase origin main || true
              git push origin HEAD:main || true
            else
              echo "No changes to commit in run #$i."
            fi
            
            if [ $i -lt 3 ]; then
              ELAPSED=$(( $(date +%s) - START_TS ))
              SLEEP_TIME=$(( 120 - ELAPSED ))
              if [ $SLEEP_TIME -gt 0 ]; then
                echo "Waiting ${SLEEP_TIME}s to maintain exact 2-minute cadence..."
                sleep $SLEEP_TIME
              fi
            fi
          done

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
