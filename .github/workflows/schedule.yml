name: Commodity Price Alerter

on:
  schedule:
    # Runs every 5 minutes from 3:00 AM to 6:59 PM UTC (8:30 AM to 12:29 AM IST), Monday through Friday
    - cron: '*/5 3-18 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the UI
  repository_dispatch:
    types: [trigger-cron] # Allows triggering via external webhook

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python main.py
