name: Commodity Price Alerter

on:
  schedule:
    # Runs every 5 minutes during MCX trading days (runner loops 4 times with 60s intervals)
    - cron: '*/5 * * * 1-5'
  workflow_dispatch: # Allows manual trigger from the UI
  repository_dispatch:
    types: [trigger-cron] # Allows triggering via external webhook

permissions:
  contents: write

concurrency:
  group: alerter-cron
  cancel-in-progress: true

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intraday Monitoring (Every 1 Minute Loop)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Execute 1-minute interval checks within the runner
          for i in 1 2 3 4; do
            echo "=== Intraday 1-Minute Check #$i at $(date -u) ==="
            python main.py
            
            git add web/near_alerts.json web/circuits_data.json web/circuits_history_30d.json web/circuits_history_60d.json web/alerts_state.json web/advisory_trades_tracker.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update near alerts and circuit limits data" || true
              git pull --rebase origin main || true
              git push origin HEAD:main || true
            else
              echo "No changes to commit in run #$i."
            fi
            
            if [ $i -lt 4 ]; then
              echo "Waiting 60 seconds for next 1-minute check..."
              sleep 60
            fi
          done

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
