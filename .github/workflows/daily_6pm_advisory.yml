name: Daily MCX Commodity Advisories & Settlements

on:
  schedule:
    # 03:31 UTC = 09:01 (9:01 AM) IST, Monday to Friday (Morning Market Pulse & Opening Gap after MCX matching)
    - cron: '31 03 * * 1-5'
    # 03:45 UTC = 09:15 (9:15 AM) IST, Monday to Friday (NSE Market Open - Stock Investment & Equity Open Execution)
    - cron: '45 03 * * 1-5'
    # 08:00 UTC = 13:30 (1:30 PM) IST, Monday to Friday (London Breakout)
    - cron: '00 08 * * 1-5'

    # US Pit Open Advisory (08:30 AM ET):
    # - 12:30 UTC = 18:00 (6:00 PM) IST during US Daylight Saving Time (Summer EDT)
    # - 13:30 UTC = 19:00 (7:00 PM) IST during US Standard Time (Winter EST)
    - cron: '30 12 * * 1-5'
    - cron: '30 13 * * 1-5'

    # 15-Minute Confirmation & Stand Aside Playbook (08:45 AM ET):
    # - 12:45 UTC = 18:15 (6:15 PM) IST during US Daylight Saving Time (Summer EDT)
    # - 13:45 UTC = 19:15 (7:15 PM) IST during US Standard Time (Winter EST)
    - cron: '45 12 * * 1-5'
    - cron: '45 13 * * 1-5'

    # EIA Inventory & US Cash Open Evening Review (10:30 AM ET):
    # - 14:30 UTC = 20:00 (8:00 PM) IST during US Daylight Saving Time (Summer EDT)
    # - 15:30 UTC = 21:00 (9:00 PM) IST during US Standard Time (Winter EST)
    - cron: '30 14 * * 1-5'
    - cron: '30 15 * * 1-5'

    # MCX EOD Settlement & Square-off:
    # - 18:00 UTC = 23:30 (11:30 PM) IST during US Daylight Saving Time (Summer EDT)
    # - 18:25 UTC = 23:55 (11:55 PM) IST during US Standard Time (Winter EST)
    - cron: '00 18 * * 1-5'
    - cron: '25 18 * * 1-5'
  workflow_dispatch:
    inputs:
      session:
        description: 'Session Advisory / Action to Run'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '9am'
          - '130pm'
          - 'pit_open'
          - '7pm'
          - '6pm'
          - 'evening'
          - '8pm'
          - 'confirmation'
          - 'check715'
          - 'check615'
          - 'exit_eod'
          - 'exit1155pm'
          - 'exit1130pm'

permissions:
  contents: write

concurrency:
  group: daily-commodity-advisories
  cancel-in-progress: false

jobs:
  run-commodity-advisory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Session Advisory Script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.session }}" in
              9am)
                python daily_6pm_advisory.py --9am --force
                ;;
              130pm)
                python daily_6pm_advisory.py --130pm --force
                ;;
              pit_open|7pm|6pm)
                python daily_6pm_advisory.py --6pm --force
                ;;
              evening|8pm|9pm)
                python daily_6pm_advisory.py --8pm --force
                ;;
              confirmation|check715|check615)
                python daily_6pm_advisory.py --check-615
                ;;
              exit_eod|exit1155pm|exit1130pm)
                python daily_6pm_advisory.py --exit-eod
                ;;
              *)
                python daily_6pm_advisory.py --force
                ;;
            esac
          else
            python daily_6pm_advisory.py --auto
          fi

      - name: Commit State & Web Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/alerts_state.json web/circuits_data.json web/circuits_history_30d.json web/circuits_history_60d.json web/advisory_trades_tracker.json web/stock_investments_tracker.json web/golden_cross_history.json web/nifty_crossover_oversold.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-record commodity advisory dispatch state"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No state changes to commit."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
